version: 2
updates:
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
- package-ecosystem: pip
  directory: /clients/ev3-python
  schedule:
    interval: weekly
- package-ecosystem: gradle
  directory: /clients/ev3-java
  schedule:
    interval: weekly
groups:
  multi-step-actions:
    patterns:
    - github/codeql-action/*
    - gradle/actions/*
